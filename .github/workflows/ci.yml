name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apworld:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - run: just setup-ap
      - run: just check
      - run: just build
      - uses: actions/upload-artifact@v6
        with:
          name: ap_go2.apworld
          path: dist/ap_go2.apworld
  hygiene:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: jdx/mise-action@v2
      - run: actionlint
      - run: gitleaks detect --no-banner
