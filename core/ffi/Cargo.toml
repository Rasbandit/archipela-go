[package]
name = "apgo-ffi"
version = "0.0.1"
edition = "2021"
license = "MIT"
description = "UniFFI bindings (Kotlin now, Swift later) over apgo-core"

[lib]
crate-type = ["cdylib", "lib"]
name = "apgo_ffi"

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
apgo-core = { path = ".." }
uniffi = { version = "0.32", features = ["cli"] }
archipelago_rs = { version = "3", default-features = false, features = ["rustls"] }
serde_json = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }

[lints]
workspace = true
