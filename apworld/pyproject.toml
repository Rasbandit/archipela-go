[project]
name = "ap-go2-apworld"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8", "pyright>=1.1.390", "jsonschema>=4.23"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "PT", "RUF", "N", "ANN", "S", "PL", "TID", "PTH", "T20"]
ignore = ["PLR2004", "ANN401", "S311"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ANN", "PLR2004"]
"ap_go2/options.py" = ["RUF012"]  # Archipelago option classes use plain class attributes

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "../.ap"]

[tool.pyright]
include = ["ap_go2", "tests"]
extraPaths = ["../.ap"]
typeCheckingMode = "standard"
strict = [
  "ap_go2/constants.py",
  "ap_go2/names.py",
  "ap_go2/reductions.py",
  "ap_go2/trips.py",
  "ap_go2/item_plan.py",
  "ap_go2/validation.py",
  "ap_go2/slot_data.py",
]
