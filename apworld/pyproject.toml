[project]
name = "ap-go2-apworld"
version = "0.0.0"
requires-python = ">=3.12,<3.14"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.8",
    "pyright>=1.1.390",
    "jsonschema>=4.23",
    "pytest-cov>=7.1.0",
    "mutmut>=3.8.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "COM812", "ISC001",  # conflict with ruff format
  "D203", "D213",      # pick D211/D212 (google convention)
  "S311",              # random used for game generation, not crypto
  "FIX002", "TD003",   # TODOs reference issues by text
  "CPY001",            # no per-file licence headers; licence is undecided (see working-in-this-repo.md)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "D", "PLR2004", "ANN", "INP001", "SLF001"]
"ap_go2/options.py" = ["RUF012"]  # Archipelago option classes use plain class attributes

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["../.ap"]

[tool.pyright]
include = ["ap_go2", "tests"]
extraPaths = ["../.ap"]
typeCheckingMode = "strict"
reportMissingTypeStubs = false  # Archipelago core ships no stubs

[tool.coverage.run]
source = ["apworld/ap_go2"] # paths relative to the repo root (just runs pytest from there)
branch = true

[tool.coverage.report]
fail_under = 99
show_missing = true
