pre-commit:
  parallel: true
  commands:
    ruff-format:
      glob: "apworld/**/*.py"
      run: uv run --project apworld ruff format --check {staged_files}
    ruff-lint:
      glob: "apworld/**/*.py"
      run: uv run --project apworld ruff check {staged_files}
    rustfmt:
      glob: "core/**/*.rs"
      exclude: ["core/vendor/**"]
      run: cd core && PATH=$HOME/.cargo/bin:$PATH cargo fmt --all --check
    ktlint:
      glob: "android/**/*.{kt,kts}"
      run: cd android && JAVA_HOME="$(bash ../scripts/java_home.sh)" ./gradlew :app:spotlessCheck --console=plain -q
    typos:
      run: typos --force-exclude {staged_files}
    gitleaks:
      run: gitleaks protect --staged --no-banner
pre-push:
  commands:
    checks:
      use_stdin: true
      run: bash scripts/prepush.sh
commit-msg:
  commands:
    committed:
      run: committed --commit-file {1}
